# DH-Waypoint — one-command install from the published image.
#
#   cp examples/.env.example .env   # or: dh-waypoint init (generates secrets)
#   # set POSTGRES_PASSWORD in .env
#   docker compose up -d
#   docker compose exec dh-waypoint dh-waypoint doctor
#
# No source checkout or Go toolchain needed at run time. To build from
# source instead, use examples/docker-compose.public.yml.
# Pin a release with DH_WAYPOINT_VERSION (default: the version in VERSION).

services:

  dh-waypoint:
    image: ghcr.io/spencernorton/dh-waypoint:${DH_WAYPOINT_VERSION:-v5.6.0}
    container_name: dh-waypoint
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - worker
      - run
      - --all
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_NAME: bitmagnet
      POSTGRES_USER: bitmagnet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (run dh-waypoint init)}
      # Processing mode: full | basic | raw. basic stamps only a coarse
      # category in core and leaves real classification to plugins.
      PROCESSING_MODE: "${PROCESSING_MODE:-basic}"
      # Drop *.plugin.yml files into ./plugins to register plugins.
      PROCESSORS_PLUGINS_DIR: /plugins
      PROCESSORS_ADMIN_TOKEN: ${PROCESSORS_ADMIN_TOKEN:-}
      # Private tracker (opt-in): see docs/private-tracker.md
      TRACKER_ENABLED: "${TRACKER_ENABLED:-false}"
      TRACKER_PASSKEYS: ${TRACKER_PASSKEYS:-}
      TRACKER_ADMIN_TOKEN: ${TRACKER_ADMIN_TOKEN:-}
      TRACKER_PUBLIC_BASE_URL: ${TRACKER_PUBLIC_BASE_URL:-}
      TORZNAB_API_KEY: ${TORZNAB_API_KEY:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      DHT_CRAWLER_SCALING_FACTOR: "${DHT_SCALING_FACTOR:-1}"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${DH_WAYPOINT_HTTP_PORT:-3333}:3333"
      - "${DH_WAYPOINT_PEER_PORT:-3334}:3334/tcp"
      - "${DH_WAYPOINT_PEER_PORT:-3334}:3334/udp"
    volumes:
      - dh-waypoint-config:/root/.config/bitmagnet
      - dh-waypoint-data:/root/.local/share/bitmagnet
      - ./plugins:/plugins:ro
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--output", "/dev/null", "http://127.0.0.1:3333/metrics"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: dh-waypoint-postgres
    restart: unless-stopped
    shm_size: 512m
    environment:
      POSTGRES_DB: bitmagnet
      POSTGRES_USER: bitmagnet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (run dh-waypoint init)}
      PGUSER: bitmagnet
    volumes:
      - dh-waypoint-postgres:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitmagnet -d bitmagnet"]
      interval: 10s
      start_period: 20s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  dh-waypoint-config:
  dh-waypoint-data:
  dh-waypoint-postgres:
