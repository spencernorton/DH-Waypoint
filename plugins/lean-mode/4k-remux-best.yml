version: 1
id: 4k-remux-best
description: >
  Reference home-theater profile prioritizing 2160p REMUX and BluRay with
  Dolby Vision / HDR10+ and lossless Atmos / TrueHD / DTS-X audio.
enabled: false
mode: observe

scope:
  content_types: [movie, tv_show]
  season_pack_policy: separate_slot
  multi_episode_policy: separate_slot
  unlinked_policy: exclude_from_serve
  non_video_policy: pass_through

resilience:
  keep_runner_up: 1
  min_viable_seeders: 1
  require_known_seeders: false
  unknown_seeders_grace: 168h
  hysteresis:
    min_preferred_delta: 60
    min_seeder_ratio: 1.8
    allow_repack_override: true
    incumbent_grace_period: 24h

required:
  min_resolution: 1080p
  max_resolution: 4320p
  exclude_cam_ts: true
  exclude_3d: true
  sources_allowed: [REMUX, BluRay, WEBDL, WEBRip]
  modifiers_blocked: [SCREENER, REGIONAL, BRDISK]
  min_seeders: 1
  min_size_mb_movie: 2048
  max_size_mb_movie: 122880
  min_size_mb_episode: 500
  max_size_mb_episode: 30720
  require_files_info: false
  require_armiger_approved: false
  require_payload_proof: false

preferred:
  ranking_mode: weighted
  equivalence_band: 35
  resolution_order: [2160p, 4320p, 1080p]
  source_order: [REMUX, BluRay, WEBDL, WEBRip]
  codec_order: [HEVC, x265, H264, x264, AV1]
  hdr_order: [DOLBY_VISION, HDR10_PLUS, HDR10, HDR, SDR]
  audio_order: [ATMOS, TRUEHD, DTS_X, DTS, FLAC, EAC3, AC3]
  preferred_groups: [framestor, cinephiles, wildcat, epsil0n, d-z0n3, flux, ntb, hifi, ctrlhd]
  weights:
    resolution: 350
    source: 280
    codec: 90
    hdr: 110
    audio: 110
    group: 90
    size_efficiency: 40
  size_efficiency:
    mode: prefer_larger

if_found:
  order:
    - repack_proper
    - preferred_group
    - largest_size_in_band
    - highest_seeders
    - embedded_subtitles
    - newest_verified

prune:
  confirm_destructive: false
  min_age: 72h
  batch_size: 500
  max_delete_fraction_per_cycle: 0.25
  tombstone_ttl: 2160h
  revive_slot_on_winner_death: true
