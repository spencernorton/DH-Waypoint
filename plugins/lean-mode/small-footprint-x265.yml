version: 1
id: small-footprint-x265
description: >
  Storage-minimized HEVC/x265/AV1 catalog profile enforcing strict per-slot
  size caps and preferring season packs over individual TV episodes.
enabled: false
mode: observe

scope:
  content_types: [movie, tv_show]
  season_pack_policy: prefer_pack
  multi_episode_policy: prefer_individual
  unlinked_policy: exclude_from_serve
  non_video_policy: pass_through

resilience:
  keep_runner_up: 1
  min_viable_seeders: 1
  require_known_seeders: false
  unknown_seeders_grace: 168h
  hysteresis:
    min_preferred_delta: 40
    min_seeder_ratio: 1.5
    allow_repack_override: true
    incumbent_grace_period: 24h

required:
  min_resolution: 720p
  max_resolution: 1080p
  exclude_cam_ts: true
  exclude_3d: true
  modifiers_blocked: [SCREENER, REGIONAL, BRDISK, REMUX]
  codecs_allowed: [x265, HEVC, AV1]
  min_seeders: 1
  min_size_mb_movie: 300
  max_size_mb_movie: 4608
  min_size_mb_episode: 80
  max_size_mb_episode: 1536
  max_size_mb_season_pack: 15360
  require_files_info: false
  require_armiger_approved: false
  require_payload_proof: false

preferred:
  ranking_mode: weighted
  equivalence_band: 50
  resolution_order: [1080p, 720p]
  source_order: [BluRay, WEBDL, WEBRip, TV]
  codec_order: [x265, HEVC, AV1]
  hdr_order: [HDR10, HDR, SDR]
  audio_order: [OPUS, AAC, EAC3, AC3, DTS]
  preferred_groups: [qxr, tigole, megusta, psa, rartv, vyndros, silence, yts]
  weights:
    resolution: 260
    source: 180
    codec: 140
    hdr: 40
    audio: 50
    group: 70
    size_efficiency: 160
  size_efficiency:
    mode: prefer_smaller

if_found:
  order:
    - repack_proper
    - smallest_size_in_band
    - highest_seeders
    - clean_single_media_file
    - preferred_group
    - newest_verified

prune:
  confirm_destructive: false
  min_age: 72h
  batch_size: 500
  max_delete_fraction_per_cycle: 0.25
  tombstone_ttl: 2160h
  revive_slot_on_winner_death: true
