[workspace]
resolver = "2"
members = [
    "crates/dh-tms-format",
    "crates/dh-tms-grammar",
    "crates/dh-tms-hashdir",
    "crates/dh-tms-core",
    "crates/dh-tms-policy",
    "crates/dh-tms-swarm",
    "crates/dh-tms-search",
    "crates/dh-tmsd",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
dh-tms-format = { path = "crates/dh-tms-format" }
dh-tms-grammar = { path = "crates/dh-tms-grammar" }
dh-tms-hashdir = { path = "crates/dh-tms-hashdir" }
dh-tms-core = { path = "crates/dh-tms-core" }
dh-tms-policy = { path = "crates/dh-tms-policy" }
dh-tms-swarm = { path = "crates/dh-tms-swarm" }
dh-tms-search = { path = "crates/dh-tms-search" }
ahash = "0.8"
arc-swap = "1.9"
blake3 = "1.8"
byteorder = "1.5"
crc32fast = "1.5"
memmap2 = "0.9"
parking_lot = "0.12"
proptest = "1.12"
rayon = "1.12"
regex = "1.13"
roaring = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
unicode-normalization = "0.1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = "0.14"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
