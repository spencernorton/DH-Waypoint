# Rust workspace lint, crash-recovery tests, and Go-to-Rust Unix-socket E2E checks for DH-TMS.
name: DH-TMS
on:
  pull_request:
    paths:
      - 'dhtms/**'
      - 'internal/database/dhtms/**'
      - '.github/workflows/dhtms.yml'
      - 'scripts/test_v6_upgrade_drill.py'
  push:
    branches: [main]
    paths:
      - 'dhtms/**'
      - 'internal/database/dhtms/**'
      - '.github/workflows/dhtms.yml'
      - 'scripts/test_v6_upgrade_drill.py'
permissions:
  contents: read
jobs:
  rust_and_e2e:
    name: Rust workspace & Go Unix-socket E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6.4.0
        with:
          go-version-file: go.mod
      - name: Ensure rustfmt and clippy
        run: |
          rustc --version
          cargo --version
          rustup component add rustfmt clippy
      - name: Check Rust formatting
        working-directory: dhtms
        run: cargo fmt --all -- --check
      - name: Run Rust clippy
        working-directory: dhtms
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Rust unit, property, and SIGKILL crash-recovery tests
        working-directory: dhtms
        run: cargo test --workspace --release
      - name: Build dh-tmsd release binary
        working-directory: dhtms
        run: cargo build --release --bin dh-tmsd
      - name: Verify processor and headless boundaries
        run: |
          python3 scripts/test_headless_boundary.py
          python3 scripts/check_headless_boundary.py
          python3 scripts/check_processor_boundary.py
      - name: Run Go client unit and live dh-tmsd Unix-socket E2E tests
        env:
          DH_TMSD_BIN: ${{ github.workspace }}/dhtms/target/release/dh-tmsd
        run: |
          go vet ./internal/database/dhtms/...
          go test -race -count=1 -v ./internal/database/dhtms/...
      - name: Build dh-tmsd container and verify companion Compose service
        run: |
          VERSION="v$(cat VERSION)"
          COMMIT=$(git rev-parse HEAD)
          BUILD_DATE=$(git show -s --format=%cI HEAD)
          BUILD_SOURCE="https://github.com/${{ github.repository }}"
          docker build -f dhtms/Dockerfile --build-arg VERSION="$VERSION" \
            --build-arg COMMIT="$COMMIT" --build-arg BUILD_DATE="$BUILD_DATE" \
            --build-arg SOURCE="$BUILD_SOURCE" --tag dh-waypoint-tms:ci dhtms
          test "$(docker image inspect dh-waypoint-tms:ci --format '{{.Config.User}}')" = '1000:1000'
          test "$(docker image inspect dh-waypoint-tms:ci --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$VERSION"
          python3 scripts/test_v6_upgrade_drill.py --tms-only --tms-image dh-waypoint-tms:ci
