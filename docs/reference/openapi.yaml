openapi: 3.0.3
info:
  title: DH-Waypoint REST API
  version: "1"
  description: >
    Read-only REST surface over the serving-policy catalogue search
    (the same view as GraphQL). Private torrents never appear.
    Authentication: when HTTP_SERVER_API_KEY is configured, send it
    as `Authorization: Bearer <key>` or `X-API-Key: <key>`.
servers:
  - url: http://localhost:3333
paths:
  /api/v1/search:
    get:
      summary: Search torrent contents
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: Full-text query string
        - name: type
          in: query
          schema: { type: string, enum: [movie, tv_show, music, ebook, comic, audiobook, game, software, xxx, course] }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: cursor
          in: query
          schema: { type: string }
          description: Opaque keyset pagination cursor returned by next_cursor on deterministic sorts (cannot be combined with non-zero offset or order_by=relevance)
        - name: include_total
          in: query
          schema: { type: boolean, default: true }
          description: When false, skips the total-count query for lower-latency paging and sets total_count_omitted=true
        - name: resolution
          in: query
          schema: { type: string }
          description: Video resolution filter (e.g., 2160p, 1080p, 720p, or V2160p)
        - name: video_source
          in: query
          schema: { type: string, enum: [CAM, TELESYNC, TELECINE, WORKPRINT, DVD, TV, WEBDL, WEBRip, BluRay] }
        - name: video_codec
          in: query
          schema: { type: string, enum: [H264, x264, x265, XviD, DivX, MPEG2, MPEG4, HEVC, AV1] }
        - name: hdr
          in: query
          schema: { type: string, enum: [HDR, HDR10, HDR10_PLUS, DOLBY_VISION] }
        - name: min_seeders
          in: query
          schema: { type: integer, minimum: 0 }
        - name: season
          in: query
          schema: { type: integer, minimum: 0, maximum: 1000 }
        - name: episode
          in: query
          schema: { type: integer, minimum: 0, maximum: 10000 }
          description: Requires season
        - name: imdb
          in: query
          schema: { type: string, pattern: "^tt[0-9]{1,12}$" }
        - name: tmdb
          in: query
          schema: { type: string, pattern: "^[1-9][0-9]{0,11}$" }
        - name: order_by
          in: query
          schema: { type: string, enum: [published_at, seeders, leechers, size, files_count, relevance], default: published_at }
        - name: order_dir
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: Search page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/torrents/{hash}:
    get:
      summary: One torrent by info hash (serving view)
      parameters:
        - name: hash
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9a-fA-F]{40}$" }
      responses:
        "200":
          description: Torrent item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/torrents/{hash}/files:
    get:
      summary: File inventory of one torrent
      parameters:
        - name: hash
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9a-fA-F]{40}$" }
      responses:
        "200":
          description: File list
          content:
            application/json:
              schema:
                type: object
                properties:
                  info_hash: { type: string }
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        path: { type: string }
                        size: { type: integer, format: int64 }
  /api/v1/stats:
    get:
      summary: Catalogue totals
      responses:
        "200":
          description: Totals
          content:
            application/json:
              schema:
                type: object
                required: [torrent_contents, torrent_contents_is_estimate]
                properties:
                  torrent_contents: { type: integer }
                  torrent_contents_is_estimate:
                    type: boolean
                    description: True when torrent_contents is approximate. Always present, including false for exact counts.
  /api/v1/openapi.yaml:
    get:
      summary: This specification
      responses:
        "200": { description: OpenAPI document }
components:
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
  schemas:
    SearchResponse:
      type: object
      required: [total_count, total_count_is_estimate, has_next_page, items]
      properties:
        total_count:
          type: integer
          description: Matching row count; approximate when total_count_is_estimate is true.
        total_count_is_estimate:
          type: boolean
          description: True when the count budget was exceeded and total_count is an estimate. Always present, including false for exact counts.
        total_count_omitted:
          type: boolean
          description: Present and true when include_total=false skipped the count query.
        has_next_page: { type: boolean }
        next_cursor:
          type: string
          description: Opaque keyset cursor for fetching the next page on deterministic orderings.
        items:
          type: array
          items: { $ref: "#/components/schemas/Item" }
    Item:
      type: object
      properties:
        info_hash: { type: string }
        name: { type: string }
        title: { type: string }
        content_type: { type: string }
        content_source: { type: string }
        content_id: { type: string }
        size: { type: integer, format: int64 }
        files_count: { type: integer }
        seeders: { type: integer }
        leechers: { type: integer }
        published_at: { type: string, format: date-time }
        video_resolution: { type: string }
        video_source: { type: string }
        video_codec: { type: string }
        release_group: { type: string }
        is_anime: { type: boolean }
        magnet: { type: string }
