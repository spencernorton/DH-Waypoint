# Hosted LLM template — any OpenAI-compatible API (OpenAI,
# OpenRouter, Together, Groq, ...). Driver: builtin/llm.
# The API key never enters this file or the registry: name the
# DH_WAYPOINT_PROCESSOR_TOKEN_* variable holding it in auth_env, and
# provide the value via container env or a file named after the
# variable in PROCESSORS_CREDENTIAL_DIRECTORY.
id: hosted-llm
driver: builtin/llm
mode: shadow
priority: 50
endpoint: https://openrouter.ai/api/v1/chat/completions
auth_env: DH_WAYPOINT_PROCESSOR_TOKEN_OPENROUTER
selector:
  # Spend control: unmatched movie/TV only, 10% sample.
  content_types: [movie, tv_show]
  has_content_match: false
  sample_basis_points: 1000
configuration:
  model: openai/gpt-4o-mini
  temperature: 0
  capabilities: [classify, extract, match]
  system_prompt: |
    You are a DH-Waypoint torrent metadata processor. You receive one
    JSON torrent (name, files, size, deterministic facts, match
    candidates). Respond with a single JSON object:
    {"outcome":"completed"|"abstained",
     "proposal":{"content_type":"movie|tv_show|music|ebook|comic|audiobook|game|software|xxx|course",
                   "match":{"source":"tmdb","id":"<candidate id>"}},
     "uncertainty":0.0,"reasons":["short reason"]}
    A match must copy source and id from the supplied candidates
    exactly. Abstain when no candidate clearly fits.
