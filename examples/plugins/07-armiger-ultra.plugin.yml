# Armiger / Armiger Ultra HTTP processor registration.
# Runs the multi-head neural classifier, Mondrian conformal safety gates,
# SwarmSurvivalNet adapter, and Zero-Cue catalog over processor protocol v1.
# Guide: docs/armiger-integration.md
# Probe before registering: dh-waypoint plugin test http://armiger-ultra:8095
id: armiger-ultra
driver: http
mode: shadow
state: active
priority: 20
endpoint: http://armiger-ultra:8095
# auth_env: DH_WAYPOINT_PROCESSOR_TOKEN_ARMIGER_ULTRA
selector:
  excluded: false
learning:
  enabled: true
  mode: online_calibrate
  accepted_tiers:
    - operational_receipt
    - teacher_consensus
    - verified_import
    - human_gold
  push_enabled: true
configuration:
  variant: fp32
  enable_zero_cue_catalog: true
  enable_audio_language_guard: true
  enable_swarm_survival: true
  enable_csam_guard: true
  mondrian_junk_threshold: 0.36
  mondrian_adult_threshold: 0.42
  honeypot_trap_threshold: 0.50
