# Start the independent adapter first; see docs/processors/llm.md.
# This endpoint is a processor service, never the inference provider.
id: local-llm
driver: http
mode: shadow
priority: 50
endpoint: http://llm-local:8091
# A separate service-auth token; never put a provider key in core.
auth_env: DH_WAYPOINT_PROCESSOR_TOKEN_LOCAL_LLM
selector:
  content_types: [unknown, movie, tv_show]
  has_content_match: false
  sample_basis_points: 2500
learning:
  enabled: true
  mode: log_only
  push_enabled: false  # enable after configuring adapter feedback_file
  accepted_tiers: [operational_receipt, teacher_consensus, verified_import, human_gold]
configuration: {}
